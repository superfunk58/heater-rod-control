<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Lüftung Bad</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #e2e8f0;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 400px; margin: 0 auto; }
.header {
  text-align: center;
  padding: 16px 0;
  border-bottom: 1px solid #334155;
  margin-bottom: 20px;
}
.header h1 { font-size: 20px; font-weight: 600; color: #f1f5f9; }
.header .time { font-size: 14px; color: #94a3b8; margin-top: 4px; }
.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.status-box {
  background: rgba(30, 41, 59, 0.8);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}
.status-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
.status-value { font-size: 28px; font-weight: 600; color: #f1f5f9; }
.status-value.temp { color: #f97316; }
.status-value.hum { color: #38bdf8; }
.led-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
  padding: 12px;
  background: rgba(30, 41, 59, 0.5);
  border-radius: 12px;
}
.led-item { text-align: center; }
.led-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #475569;
  margin: 0 auto 4px;
}
.led-dot.on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.led-label { font-size: 11px; color: #94a3b8; }
.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.btn {
  padding: 20px 16px;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.2s;
  color: white;
}
.btn:active { transform: scale(0.97); }
.btn-fan { background: linear-gradient(135deg, #3b82f6, #2563eb); }
.btn-fan.active { background: linear-gradient(135deg, #22c55e, #16a34a); }
.btn-heater { background: linear-gradient(135deg, #f97316, #ea580c); }
.btn-heater.active { background: linear-gradient(135deg, #ef4444, #dc2626); }
.btn-absaugen { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
.btn-absaugen.active { background: linear-gradient(135deg, #22c55e, #16a34a); }
.btn-absaugen-cyclic { background: linear-gradient(135deg, #6366f1, #4f46e5); }
.btn-absaugen-cyclic.active { background: linear-gradient(135deg, #22c55e, #16a34a); }
.btn-bath { background: linear-gradient(135deg, #a855f7, #7c3aed); }
.btn-bath.active { background: linear-gradient(135deg, #ef4444, #dc2626); }
.btn-auto { background: linear-gradient(135deg, #f59e0b, #d97706); }
.btn-auto.active { background: linear-gradient(135deg, #22c55e, #16a34a); }
.footer {
  text-align: center;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #334155;
}
.footer a { color: #64748b; font-size: 12px; text-decoration: none; }
.footer a:hover { color: #94a3b8; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Lüftung Bad OG</h1>
    <div class="time" id="timeDisplay">--</div>
  </div>
  
  <div class="status-grid">
    <div class="status-box">
      <div class="status-label">Temperatur</div>
      <div class="status-value temp" id="tempVal">--</div>
    </div>
    <div class="status-box">
      <div class="status-label">Feuchte</div>
      <div class="status-value hum" id="humVal">--</div>
    </div>
    <div class="status-box">
      <div class="status-label">Nächster Zyklus</div>
      <div class="status-value cycle" id="cycleVal">--</div>
    </div>
  </div>
  
  <div class="led-row">
    <div class="led-item">
      <div class="led-dot" id="ledFan"></div>
      <div class="led-label">Lüfter</div>
    </div>
    <div class="led-item">
      <div class="led-dot" id="ledHeater"></div>
      <div class="led-label">Heizung</div>
    </div>
    <div class="led-item">
      <div class="led-dot" id="ledAuto"></div>
      <div class="led-label">Auto</div>
    </div>
    <div class="led-item">
      <div class="led-dot" id="ledBath"></div>
      <div class="led-label">Pause</div>
    </div>
  </div>
  
  <div class="btn-grid">
    <button class="btn btn-fan" id="btnFan">Lüfter AN</button>
    <button class="btn btn-heater" id="btnHeater">Heizung AN</button>
    <button class="btn btn-absaugen" id="btnAbsaugen">Absaugen</button>
    <button class="btn btn-absaugen-cyclic" id="btnAbsaugenCyclic">Absaugen Zyklus</button>
    <button class="btn btn-bath" id="btnBath">Badepause</button>
    <button class="btn btn-auto" id="btnAuto">Automatik</button>
  </div>
  
  <div class="footer">
    <a href="/">Erweiterte Ansicht →</a>
  </div>
</div>

<script>
var fanOn = false, heaterOn = false, autoOn = true, bathActive = false;

function post(url, params) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: params ? params.toString() : ''
  });
}

function loadStatus() {
  fetch('/status').then(function(r) { return r.json(); }).then(function(s) {
    document.getElementById('timeDisplay').textContent = s.current_time || '--';
    document.getElementById('tempVal').textContent = typeof s.temperature_c === 'number' ? s.temperature_c.toFixed(1) + '°' : '--';
    document.getElementById('humVal').textContent = typeof s.humidity === 'number' ? s.humidity.toFixed(0) + '%' : '--';
    
    fanOn = s.fan_on;
    heaterOn = s.heater_on;
    autoOn = s.auto_enabled;
    bathActive = s.bath_pause_active;
    
    document.getElementById('ledFan').className = 'led-dot' + (s.fan_on ? ' on' : '');
    document.getElementById('ledHeater').className = 'led-dot' + (s.heater_on ? ' on' : '');
    document.getElementById('ledAuto').className = 'led-dot' + (s.auto_enabled ? ' on' : '');
    document.getElementById('ledBath').className = 'led-dot' + (s.bath_pause_active ? ' on' : '');
    
    function fmtTime(secs) {
      var m = Math.floor(secs / 60);
      var s = secs % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
    
    var fanBtn = document.getElementById('btnFan');
    if (s.fan_on && s.manual_secs_remaining > 0 && s.manual_secs_remaining < 999999) {
      fanBtn.textContent = 'Lüfter ' + fmtTime(s.manual_secs_remaining);
    } else {
      fanBtn.textContent = 'Lüfter';
    }
    fanBtn.className = 'btn btn-fan' + (s.fan_on ? ' active' : '');
    
    var heaterBtn = document.getElementById('btnHeater');
    if (s.heater_on && s.manual_secs_remaining > 0 && s.manual_secs_remaining < 999999) {
      heaterBtn.textContent = 'Heizung ' + fmtTime(s.manual_secs_remaining);
    } else {
      heaterBtn.textContent = 'Heizung';
    }
    heaterBtn.className = 'btn btn-heater' + (s.heater_on ? ' active' : '');
    
    var bathBtn = document.getElementById('btnBath');
    if (s.bath_pause_active && s.bath_pause_secs_remaining) {
      bathBtn.textContent = 'Pause ' + fmtTime(s.bath_pause_secs_remaining);
      bathBtn.className = 'btn btn-bath active';
    } else {
      bathBtn.textContent = 'Badepause';
      bathBtn.className = 'btn btn-bath';
    }
    
    var autoBtn = document.getElementById('btnAuto');
    autoBtn.textContent = 'Auto';
    autoBtn.className = 'btn btn-auto' + (s.auto_enabled ? ' active' : '');
    
    var absaugenCyclicBtn = document.getElementById('btnAbsaugenCyclic');
    if (s.absaugen_cyclic_running && s.absaugen_cyclic_secs_remaining > 0) {
      absaugenCyclicBtn.textContent = 'Absaugen Zyklus ' + fmtTime(s.absaugen_cyclic_secs_remaining);
    } else if (s.absaugen_cyclic_enabled && s.absaugen_cyclic_next_secs > 0) {
      absaugenCyclicBtn.textContent = 'Absaugen Zyklus ' + fmtTime(s.absaugen_cyclic_next_secs);
    } else {
      absaugenCyclicBtn.textContent = 'Absaugen Zyklus';
    }
    absaugenCyclicBtn.className = 'btn btn-absaugen-cyclic' + (s.absaugen_cyclic_enabled ? ' active' : '');
    
    // Countdown nächster Lüftungszyklus
    var cycleEl = document.getElementById('cycleVal');
    if (s.cyclic_secs_remaining > 0) {
      cycleEl.textContent = 'Läuft ' + fmtTime(s.cyclic_secs_remaining);
    } else if (s.cyclic_next_secs > 0) {
      cycleEl.textContent = fmtTime(s.cyclic_next_secs);
    } else if (s.cyclic_next_secs === -1) {
      cycleEl.textContent = 'Warte NTP';
    } else {
      cycleEl.textContent = s.cyclic_enabled ? 'Bereit' : 'Aus';
    }
  }).catch(function(e) { console.error(e); });
}

document.getElementById('btnFan').addEventListener('click', function() {
  var params = new URLSearchParams();
  if (fanOn) {
    params.append('manual_secs', '0');
  } else {
    params.append('manual_fan', 'on');
    params.append('manual_secs', '300');
  }
  post('/manual', params).then(loadStatus);
});

document.getElementById('btnHeater').addEventListener('click', function() {
  var params = new URLSearchParams();
  if (heaterOn) {
    params.append('manual_secs', '0');
  } else {
    params.append('manual_heater', 'on');
    params.append('manual_secs', '300');
  }
  post('/manual', params).then(loadStatus);
});

document.getElementById('btnAbsaugen').addEventListener('click', function() {
  var params = new URLSearchParams();
  params.append('fan_direction', 'true');
  post('/fan_direction', params).then(loadStatus);
});

document.getElementById('btnAbsaugenCyclic').addEventListener('click', function() {
  post('/absaugen_cyclic_toggle', new URLSearchParams()).then(loadStatus);
});

document.getElementById('btnBath').addEventListener('click', function() {
  var params = new URLSearchParams();
  if (bathActive) {
    params.append('action', 'stop');
  } else {
    params.append('minutes', '30');
  }
  post('/bath_pause', params).then(loadStatus);
});

document.getElementById('btnAuto').addEventListener('click', function() {
  post('/auto_toggle', new URLSearchParams()).then(loadStatus);
});

loadStatus();
setInterval(loadStatus, 3000);
</script>
</body>
</html>

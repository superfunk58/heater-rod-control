[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; ESP32 DevKit v1 (30-pin) - WiFi + MQTT + PsychicHttp + SSE + LittleFS + OTA
; PsychicHttp wraps ESP-IDF's esp_http_server (Espressif-maintained, stable,
; no AsyncTCP thread-safety footguns). Realtime UI via Server-Sent Events
; on /events, so the browser no longer polls /api/status.
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions_homekit.csv
build_type = release
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    ; HomeSpan: allow slightly larger pairings table / log verbosity tuning
    -DHOMESPAN_MDNS_BUFFER=1024
    ; Default MQTT host (field setup: 192.168.178.67, no DNS)
    -DMQTT_HOST_DEFAULT=\"192.168.178.67\"
lib_deps =
    olikraus/U8g2 @ ^2.35.19
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.8
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    ; PsychicHttp: HTTP + WebSocket + SSE on top of esp_http_server.
    ; Use a pinned commit once we stabilize; ^ gives us fixes until then.
    hoeken/PsychicHttp @ ^1.2.1
    ; Apple HomeKit (HAP R2) accessory stack. 1.9.1 is the last release
    ; that targets Arduino-ESP32 2.x (IDF-4); HomeSpan 2.0+ requires IDF-5.
    homespan/HomeSpan @ ~1.9.1
lib_extra_dirs = lib

; USB-serial upload (adjust port)
; 460800 is a good balance of speed and reliability. Try 921600 if your
; USB-serial adapter supports it, or drop to 230400/115200 on failures.
upload_speed = 460800
upload_port = /dev/cu.usbserial-*
; To erase entire flash (useful after partition table changes) run:
;   pio run -t erase
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; OTA upload (ArduinoOTA) - uses fixed IP for field WiFi (no DNS)
; Usage: pio run -e esp32dev_ota -t upload
; ---------------------------------------------------------------------------
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.178.83
upload_flags =
    --port=3232
; Quiet progress: emit one 'Uploading: NN%' line per 10 % instead of per block.
extra_scripts = post:tools/ota_quiet.py

; NOTE: HTTP-OTA via the /update endpoint (PsychicUploadHandler) was tried
; as a faster alternative to espota but PsychicHttp 1.2.1 has a known bug
; where the upload stream resets the TCP connection at ~128 KB. Stay with
; espota for now; revisit when PsychicHttp is upgraded or the /update
; handler is rewritten as a raw esp_http_server route.
